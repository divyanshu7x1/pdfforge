services:
  - type: web
    name: pdfforge-backend
    runtime: node
    rootDir: backend
    buildCommand: npx pnpm install --frozen-lockfile --prod=false && npx pnpm build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
